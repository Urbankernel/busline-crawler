# ============================================================
# 公交线路抓取工具 · 配置文件（模板）
# ------------------------------------------------------------
# 使用方式：
#   1. 复制本文件为 config.yaml，按需修改（程序默认优先读取 config.yaml）；
#   2. 未创建 config.yaml 时，程序回退读取本 example.yaml（占位模板）；
#   3. 也可用 --config 显式指定配置文件路径（如 busline --config my.yaml amap）。
# 优先级：命令行参数 > 配置文件 > 内置默认值。
# 说明：布尔开关（gpkg / geojson / headed 等）命令行只能「开启」、无法覆盖为「关闭」。
#       密钥与检索参数分开存放：密钥放 configs/keys.txt（模板见 configs/keys.txt.example），
#       本配置文件只放检索参数，不写入密钥。
# ============================================================

# 默认数据源：amap（高德，零依赖）| baidu（百度，需 Playwright）
# 命令行 busline amap / busline baidu 会覆盖此项；不传子命令时用这里的 provider
provider: amap

# ---------- 通用参数（两个数据源共用） ----------
city: 上海                 # 城市名
outdir: runs               # 根输出目录（数据写入其下按命名规则生成的子文件夹）

# ---------- 高德专属参数 ----------
amap:
  max_num: 1000            # 数字穷举上限
  max_qps: 28.0            # 每秒最大请求数（硬上限 30）
  delay: 0.0               # 每次请求间隔秒数（防限流）
  lines: ""                # 指定线路，逗号分隔（留空则数字穷举全城市）
  prefix: ""               # 前缀，与 lines 组合生成「前缀+线路」关键字
  suffix: ""               # 数字后缀，仅数字穷举模式与 prefix 组合（如 浦东+N+路）
  extra: "高铁,旅游,观光,接驳线,夜,假日,高峰,机场"  # 特殊关键字，逗号分隔（留空 = 不追加，纯数字穷举）
  only: ""                 # 只检索指定关键字，逗号分隔（不做数字穷举）
  exact: false             # 精确检索：只保留短名与关键字完全一致的线路（true=精确，false=模糊）
  gpkg: false              # 输出 GeoPackage
  geojson: false           # 输出 GeoJSON 线要素

# ---------- 百度专属参数 ----------
baidu:
  max_num: 1000            # 数字穷举上限
  delay_ms: 1000           # 请求间隔毫秒
  timeout: 0               # 抓取总超时秒数（0=自动按关键字数计算，保证全量穷举不被截断）
  headed: false            # 显示浏览器窗口（默认无头）
  lines: ""                # 指定线路，逗号分隔（模糊检索后按短名精确过滤）
  prefix: ""               # 前缀，与 lines 组合生成「前缀+线路」关键字
  suffix: ""               # 数字后缀，仅数字穷举模式与 prefix 组合（如 浦东+N+路）
  extra: "高铁,旅游,观光,接驳线,夜,假日,高峰,机场"  # 特殊关键字，逗号分隔（留空 = 不追加，纯数字穷举）
  only: ""                 # 只检索指定关键字（不做数字穷举、不做精确过滤）
  exact: false             # 精确检索：只保留短名与关键字完全一致的线路（true=精确，false=模糊）
  gpkg: false              # 输出 GeoPackage
